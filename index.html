<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor de Etiquetas</title>
  <!--
    Leitor ao vivo (somente DataMatrix), hospedado no GitHub Pages.
    Só grava depois de login com conta Google da empresa: o servidor confere
    o login e devolve uma sessão; cada envio leva essa sessão.
    Esta página não contém senha nem token: pode ficar em repositório público.
  -->
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 12px; background: #111; color: #eee; }
    #telaLogin { text-align: center; padding: 40px 12px; }
    #telaLogin h1 { font-size: 22px; }
    #botaoGoogle { display: inline-block; margin: 20px 0; }
    #telaLeitor { display: none; }
    video { width: 100%; max-height: 50vh; background: #000; border-radius: 8px; object-fit: cover; }
    .faixa { margin: 8px 0; padding: 10px; border-radius: 6px; background: #333; font-weight: bold; }
    .faixa.ok { background: #1b6e2d; }
    .faixa.aviso { background: #8a6d00; }
    .faixa.erro { background: #8a1c1c; }
    #envio { font-weight: normal; font-size: 13px; }
    #placar { display: flex; gap: 8px; margin-bottom: 10px; }
    #placar div { flex: 1; background: #222; border-radius: 6px; padding: 8px; text-align: center; font-size: 12px; }
    #placar b { display: block; font-size: 24px; }
    ul { list-style: none; padding: 0; margin: 0 0 10px; font-size: 13px; word-break: break-all; }
    li { padding: 4px 0; border-bottom: 1px solid #333; }
    button { font-size: 15px; padding: 10px 14px; margin: 0 8px 8px 0; border: 0; border-radius: 6px; }
    #usuario { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div id="telaLogin">
    <h1>Leitor de Etiquetas</h1>
    <p>Entre com a sua conta da empresa para começar.</p>
    <div id="botaoGoogle"></div>
    <div id="msgLogin" class="faixa" style="display:none"></div>
  </div>

  <div id="telaLeitor">
    <video id="video" playsinline muted autoplay></video>
    <div id="status" class="faixa">Iniciando…</div>
    <div id="envio" class="faixa">Gravação: aguardando leituras</div>
    <div id="placar">
      <div><b id="nLidas">0</b>etiquetas lidas</div>
      <div><b id="nGravadas">0</b>gravadas</div>
      <div><b id="nRepetidas">0</b>já na planilha</div>
      <div><b id="nPendentes">0</b>na fila</div>
    </div>
    <ul id="ultimas"></ul>
    <button id="ligar">Ligar câmera</button>
    <button id="sair">Sair</button>
    <div id="usuario"></div>
  </div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // ---------- Configuração: preencha antes de enviar ao GitHub (nenhum dos dois é segredo) ----------
  const URL_WEBAPP = 'https://script.google.com/macros/s/AKfycbw9MoEZ8RRaC-t88asWYN1FhVd1e17T4ijc_1fBiyG9itdINwQ7oSDXMOVbfXrxpJ39/exec';
  const CLIENT_ID = '832294514610-qkndmjqt960674241dhpt052s780lltv.apps.googleusercontent.com';
  const DOMINIO = 'sbxgroup.com';

  const INTERVALO_ENVIO_MS = 2000;   // envia a fila em lotes a cada 2 s
  const TAMANHO_LOTE = 100;
  const CHAVE_FILA = 'leitorFilaEtiquetas';
  const CHAVE_SESSAO = 'leitorSessao';

  const video = document.getElementById('video');
  const elStatus = document.getElementById('status');
  const elEnvio = document.getElementById('envio');
  const elMsgLogin = document.getElementById('msgLogin');

  const brutosVistos = new Set();    // conteúdos já enfileirados (cada variante é enviada uma vez)
  const codigosVistos = new Set();   // etiquetas já contadas (sem o prefixo "5.")
  let fila = [];
  let sessao = null;                 // {sessao, email, expira}
  let enviando = false, lidas = 0, gravadas = 0, repetidas = 0, lacoAtivo = false, audio = null;

  function status(texto, classe) { elStatus.textContent = texto; elStatus.className = 'faixa ' + (classe || ''); }
  function envio(texto, classe) { elEnvio.textContent = texto; elEnvio.className = 'faixa ' + (classe || ''); }
  function msgLogin(texto, classe) {
    elMsgLogin.style.display = texto ? 'block' : 'none';
    elMsgLogin.textContent = texto; elMsgLogin.className = 'faixa ' + (classe || '');
  }

  async function chamar(corpo) {
    // text/plain evita a verificação prévia (preflight) que o Apps Script não responde
    const resp = await fetch(URL_WEBAPP, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(corpo)
    });
    return resp.json();
  }

  // ---------- Login ----------
  function mostrarLeitor() {
    document.getElementById('telaLogin').style.display = 'none';
    document.getElementById('telaLeitor').style.display = 'block';
    document.getElementById('usuario').textContent = 'Conectado como ' + sessao.email;
    iniciar();
  }

  function mostrarLogin(mensagem) {
    sessao = null;
    try { localStorage.removeItem(CHAVE_SESSAO); } catch (e) {}
    document.getElementById('telaLeitor').style.display = 'none';
    document.getElementById('telaLogin').style.display = 'block';
    msgLogin(mensagem || '', mensagem ? 'aviso' : '');
  }

  async function aoEntrarComGoogle(resposta) {
    try {
      msgLogin('Conferindo o login…', '');
      const r = await chamar({ acao: 'entrar', idToken: resposta.credential });
      if (r.status !== 'ok') { msgLogin('Não foi possível entrar: ' + (r.mensagem || 'erro'), 'erro'); return; }
      sessao = { sessao: r.sessao, email: r.email, expira: r.expira };
      try { localStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao)); } catch (e) {}
      msgLogin('', '');
      mostrarLeitor();
    } catch (e) {
      msgLogin('Falha ao falar com a planilha: ' + e.message, 'erro');
    }
  }

  function prepararLogin() {
    if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(prepararLogin, 200); return; }
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: aoEntrarComGoogle, hd: DOMINIO, auto_select: true });
    google.accounts.id.renderButton(document.getElementById('botaoGoogle'), { theme: 'filled_blue', size: 'large', text: 'signin_with' });
  }

  document.getElementById('sair').onclick = function () {
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    mostrarLogin('Você saiu. As leituras que estavam na fila continuam guardadas neste aparelho.');
  };

  // ---------- Leitura ----------
  /** "5.CB23263360" -> "CB23263360" */
  function codigoDe(valor) {
    const m = /^\d+\.(.+)$/.exec(valor);
    return m ? m[1] : valor;
  }

  // A fila fica guardada no aparelho: recarregar a página recupera o que não foi gravado
  function carregarFila() {
    try { fila = JSON.parse(localStorage.getItem(CHAVE_FILA)) || []; } catch (e) { fila = []; }
    fila.forEach(function (l) { brutosVistos.add(l.valor); codigosVistos.add(codigoDe(l.valor)); });
  }
  function guardarFila() {
    try { localStorage.setItem(CHAVE_FILA, JSON.stringify(fila)); } catch (e) {}
  }

  function placar() {
    document.getElementById('nLidas').textContent = lidas;
    document.getElementById('nGravadas').textContent = gravadas;
    document.getElementById('nRepetidas').textContent = repetidas;
    document.getElementById('nPendentes').textContent = fila.length;
  }

  function bip(freq) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator();
      o.frequency.value = freq; o.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.1);
    } catch (e) {}
  }

  function aoLer(valor) {
    valor = String(valor || '').trim();
    if (!valor || brutosVistos.has(valor)) return;
    brutosVistos.add(valor);
    fila.push({ valor: valor, lidoEm: new Date().toISOString() });
    guardarFila();

    const codigo = codigoDe(valor);
    if (!codigosVistos.has(codigo)) {      // etiqueta nova (o segundo DataMatrix dela não conta de novo)
      codigosVistos.add(codigo);
      lidas++;
      bip(880);
      const lista = document.getElementById('ultimas');
      const li = document.createElement('li');
      li.textContent = codigo;
      lista.insertBefore(li, lista.firstChild);
      while (lista.children.length > 8) lista.removeChild(lista.lastChild);
      status('Lido: ' + codigo, 'ok');
    }
    placar();
  }

  // ---------- Gravação em lotes ----------
  async function enviarFila() {
    if (enviando || !fila.length || !sessao) return;
    enviando = true;
    const lote = fila.slice(0, TAMANHO_LOTE);
    try {
      const r = await chamar({ acao: 'gravar', sessao: sessao.sessao, codigos: lote });
      if (r.status === 'sessao') { mostrarLogin('Sua sessão venceu. Entre de novo para continuar gravando.'); return; }
      if (r.status !== 'ok') { envio('Planilha recusou: ' + (r.mensagem || 'resposta inesperada'), 'erro'); return; }
      const enviados = new Set(lote.map(function (l) { return l.valor; }));
      fila = fila.filter(function (l) { return !enviados.has(l.valor); });
      guardarFila();
      gravadas += r.gravadas; repetidas += r.duplicadas;
      placar();
      envio('Último envio: ' + r.gravadas + ' gravadas, ' + r.duplicadas + ' já na planilha (' +
        new Date().toLocaleTimeString() + ')', '');
    } catch (e) {
      // Fica na fila e tenta de novo no próximo ciclo
      envio('Sem gravar (' + e.message + '). ' + fila.length + ' na fila, tentando de novo…', 'erro');
    } finally {
      enviando = false;
    }
  }
  setInterval(enviarFila, INTERVALO_ENVIO_MS);

  // ---------- Câmera ----------
  const CAMERA = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };

  function manterTelaLigada() {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && lacoAtivo) manterTelaLigada();
  });

  async function iniciarNativo(fluxo) {
    const detector = new BarcodeDetector({ formats: ['data_matrix'] });
    video.srcObject = fluxo;
    await video.play();
    status('Aponte para o DataMatrix', '');
    if (lacoAtivo) return;
    lacoAtivo = true;
    (async function laco() {
      try {
        const achados = await detector.detect(video);
        achados.forEach(function (a) { aoLer(a.rawValue); });
      } catch (e) {}
      setTimeout(laco, 30);   // lê o mais rápido que o aparelho permitir
    })();
  }

  function carregarScript(url) {
    return new Promise(function (ok, falha) {
      const s = document.createElement('script');
      s.src = url; s.onload = ok; s.onerror = falha; document.head.appendChild(s);
    });
  }

  // Reserva para navegadores sem BarcodeDetector (ex.: iPhone, Chrome no Windows)
  async function iniciarZXing(fluxo) {
    if (!window.ZXing) await carregarScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js');
    const dicas = new Map();
    dicas.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.DATA_MATRIX]);
    const leitor = new ZXing.BrowserMultiFormatReader(dicas);
    await leitor.decodeFromStream(fluxo, video, function (resultado) {
      if (resultado) aoLer(resultado.getText());
    });
    lacoAtivo = true;
    status('Aponte para o DataMatrix (modo compatibilidade, mais lento)', '');
  }

  const DICAS = {
    NotAllowedError: 'permissão negada pelo navegador ou pelo sistema',
    NotFoundError: 'nenhuma câmera encontrada neste aparelho',
    NotReadableError: 'câmera em uso por outro programa',
    OverconstrainedError: 'a câmera não atende à resolução pedida'
  };

  async function iniciar() {
    if (lacoAtivo) return;
    let modo = 'pedido da câmera';
    try {
      if (!navigator.mediaDevices) throw new Error('esta página precisa ser aberta por HTTPS');
      status('Iniciando câmera…', '');
      const fluxo = await navigator.mediaDevices.getUserMedia(CAMERA);
      let nativo = false;
      if ('BarcodeDetector' in window) {
        const formatos = await BarcodeDetector.getSupportedFormats();
        nativo = formatos.indexOf('data_matrix') !== -1;
      }
      modo = nativo ? 'nativo' : 'ZXing';
      if (nativo) await iniciarNativo(fluxo); else await iniciarZXing(fluxo);
      document.getElementById('ligar').style.display = 'none';
      manterTelaLigada();
    } catch (e) {
      const nome = (e && e.name) || 'Erro';
      status('Câmera não abriu [' + nome + ' / modo ' + modo + ']: ' +
        ((e && e.message) || e) + (DICAS[nome] ? ' — ' + DICAS[nome] : ''), 'erro');
    }
  }
  document.getElementById('ligar').onclick = iniciar;

  // ---------- Início ----------
  carregarFila();
  placar();
  try { sessao = JSON.parse(localStorage.getItem(CHAVE_SESSAO)); } catch (e) { sessao = null; }
  if (sessao && sessao.sessao && sessao.expira > Date.now()) {
    mostrarLeitor();
  } else {
    sessao = null;
  }
  prepararLogin();
</script>
</body>
</html>
